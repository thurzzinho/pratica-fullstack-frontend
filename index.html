<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2c5c">
    <title>Cadastro de Livros da Bíblia</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images.png" type="image/png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Livros da Bíblia</h1>
        <p>Gerencie os livros da Bíblia cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo Livro</h2>

        <form id="form-livro">
          <input type="hidden" id="livro-id">

          <label for="Livro">Livro</label>
          <input id="livro" name="livro" type="text" required>

          <label for="testamento">Testamento</label>
          <select id="testamento" name="testamento" required>
            <option value="" hidden>Selecione</option>
            <option value="Antigo">Antigo</option>
            <option value="Novo">Novo</option>
          </select>

          <label for="capitulos">Capítulos</label>
          <input id="capitulos" name="capitulos" type="number" min="1">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Livros</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar livro pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do livro">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-livros" class="lista-livros"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
